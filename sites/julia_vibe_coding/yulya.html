<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Юля лучше всех</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #ffe9f0 0%, #fff7d6 50%, #e0f7ff 100%);
    overflow: hidden;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 5rem);
    color: #ff4f9a;
    text-shadow: 3px 3px 0 #ffd6e8;
    text-align: center;
    transition: transform .4s cubic-bezier(.34,1.56,.64,1), color .4s;
  }

  h1.pop { animation: bounce .6s cubic-bezier(.34,1.56,.64,1); }

  @keyframes bounce {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.25) rotate(-3deg); }
    100% { transform: scale(1); }
  }

  button {
    font-size: clamp(1.5rem, 5vw, 3rem);
    font-weight: 800;
    padding: 32px 64px;
    border: none;
    border-radius: 999px;
    color: #fff;
    background: linear-gradient(180deg, #ff8ec7 0%, #ff4f9a 100%);
    box-shadow: 0 12px 0 #cc2f77, 0 20px 30px rgba(0,0,0,.25);
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform .12s, box-shadow .12s;
  }

  button:hover  { transform: translateY(-4px); }
  button:active {
    transform: translateY(8px);
    box-shadow: 0 4px 0 #cc2f77, 0 8px 14px rgba(0,0,0,.25);
  }

  .forest {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 45vh;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
  }

  .tree {
    flex: 0 0 auto;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,.15));
    transform-origin: bottom center;
    animation: sway 5s ease-in-out infinite;
  }

  .tree:nth-child(2n)  { animation-duration: 6.5s; }
  .tree:nth-child(3n)  { animation-duration: 7.5s; animation-delay: -2s; }

  @keyframes sway {
    0%, 100% { transform: rotate(-1.5deg); }
    50%      { transform: rotate(1.5deg);  }
  }

  .perch { position: relative; }

  .parrot {
    position: absolute;
    left: 50%;
    margin-left: -30px;
    bottom: 74px;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.2));
    animation: bob 2.4s ease-in-out infinite;
    transform-origin: 50% 100%;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-5px) rotate(-4deg); }
  }

  .confetti {
    position: fixed;
    top: -20px;
    font-size: 26px;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 10;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }
</style>
</head>
<body>

<h1 id="text">Юля лучше всех</h1>

<button id="btn">Нажми меня!</button>

<div class="forest" aria-hidden="true">
  <!-- елочка -->
  <svg class="tree" width="110" height="220" viewBox="0 0 110 220">
    <rect x="47" y="170" width="16" height="50" rx="4" fill="#8b5a2b"/>
    <polygon points="55,0 100,70 10,70"   fill="#2e8b57"/>
    <polygon points="55,45 105,120 5,120"  fill="#37a06a"/>
    <polygon points="55,95 110,180 0,180"  fill="#2e8b57"/>
  </svg>

  <!-- круглое дерево -->
  <svg class="tree" width="130" height="200" viewBox="0 0 130 200">
    <rect x="57" y="120" width="16" height="80" rx="5" fill="#7a4e26"/>
    <circle cx="65" cy="70"  r="52" fill="#3ba55d"/>
    <circle cx="30" cy="100" r="34" fill="#4bbd6f"/>
    <circle cx="100" cy="100" r="34" fill="#359a58"/>
  </svg>

  <!-- высокая ель -->
  <svg class="tree" width="90" height="270" viewBox="0 0 90 270">
    <rect x="37" y="215" width="16" height="55" rx="4" fill="#8b5a2b"/>
    <polygon points="45,0 82,55 8,55"    fill="#37a06a"/>
    <polygon points="45,40 87,110 3,110"  fill="#2e8b57"/>
    <polygon points="45,85 90,165 0,165"  fill="#37a06a"/>
    <polygon points="45,135 92,230 -2,230" fill="#2e8b57"/>
  </svg>

  <!-- кустистое дерево -->
  <svg class="tree" width="150" height="180" viewBox="0 0 150 180">
    <rect x="66" y="105" width="18" height="75" rx="6" fill="#7a4e26"/>
    <ellipse cx="75" cy="65" rx="62" ry="55" fill="#45b56c"/>
    <ellipse cx="45" cy="88" rx="36" ry="30" fill="#3ba55d"/>
    <ellipse cx="105" cy="88" rx="36" ry="30" fill="#3ba55d"/>
  </svg>

  <!-- маленькая елочка -->
  <svg class="tree" width="80" height="150" viewBox="0 0 80 150">
    <rect x="33" y="115" width="14" height="35" rx="4" fill="#8b5a2b"/>
    <polygon points="40,5 70,55 10,55"    fill="#37a06a"/>
    <polygon points="40,45 75,110 5,110"  fill="#2e8b57"/>
    <polygon points="40,85 80,145 0,145"  fill="#37a06a"/>
  </svg>

  <!-- круглое дерево 2 -->
  <svg class="tree" width="120" height="210" viewBox="0 0 120 210">
    <rect x="52" y="130" width="16" height="80" rx="5" fill="#8b5a2b"/>
    <circle cx="60" cy="75"  r="48" fill="#3ba55d"/>
    <circle cx="92" cy="105" r="32" fill="#4bbd6f"/>
    <circle cx="28" cy="105" r="32" fill="#359a58"/>
  </svg>

  <!-- широкая ель -->
  <svg class="tree" width="120" height="230" viewBox="0 0 120 230">
    <rect x="52" y="180" width="16" height="50" rx="4" fill="#7a4e26"/>
    <polygon points="60,10 105,75 15,75"   fill="#2e8b57"/>
    <polygon points="60,55 112,130 8,130"  fill="#37a06a"/>
    <polygon points="60,110 118,200 2,200" fill="#2e8b57"/>
  </svg>

  <!-- куст, на котором сидит попугай -->
  <div class="tree perch">
    <svg width="140" height="110" viewBox="0 0 140 110">
      <ellipse cx="70" cy="70" rx="65" ry="40" fill="#3ba55d"/>
      <ellipse cx="35" cy="82" rx="35" ry="26" fill="#45b56c"/>
      <ellipse cx="105" cy="82" rx="35" ry="26" fill="#359a58"/>
    </svg>

    <svg class="parrot" width="86" height="104" viewBox="0 0 86 104" aria-label="попугай">
      <!-- хвост -->
      <path d="M30 62 L8 96 L20 102 L44 74 Z" fill="#e63946"/>
      <path d="M34 66 L18 96 L26 99 L46 76 Z" fill="#ff8c42"/>
      <!-- тело -->
      <ellipse cx="44" cy="60" rx="24" ry="27" fill="#2fbf71"/>
      <!-- крыло -->
      <path d="M44 44 Q68 54 60 82 Q44 86 36 70 Q32 54 44 44 Z" fill="#16a34a"/>
      <path d="M48 54 Q62 62 57 78" stroke="#0f7a37" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- лапки на ветке -->
      <path d="M38 84 L36 98 M54 84 L56 98" stroke="#f4a100" stroke-width="5" stroke-linecap="round"/>
      <path d="M36 98 h-8 M36 98 h7 M56 98 h8 M56 98 h-7" stroke="#f4a100" stroke-width="4" stroke-linecap="round"/>
      <!-- голова -->
      <circle cx="58" cy="30" r="21" fill="#e63946"/>
      <!-- щека -->
      <ellipse cx="64" cy="35" rx="10" ry="9" fill="#ffe066"/>
      <!-- клюв -->
      <path d="M74 26 Q88 34 76 47 Q70 38 74 26 Z" fill="#ffd166"/>
      <path d="M74 38 Q80 41 77 46" stroke="#e0a300" stroke-width="2" fill="none"/>
      <!-- хохолок -->
      <path d="M52 12 Q46 -2 58 4 Q56 -6 70 2 Q62 8 62 16 Z" fill="#ff8c42"/>
      <!-- глаз -->
      <circle cx="62" cy="26" r="4.5" fill="#1b1b1b"/>
      <circle cx="63.5" cy="24.5" r="1.6" fill="#ffffff"/>
    </svg>
  </div>
</div>

<script>
  const text = document.getElementById('text');
  const btn  = document.getElementById('btn');
  let changed = false;

  // Веселый звук на Web Audio API (арпеджио в мажоре + смайлик-писк)
  function playHappySound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;

    // быстрая восходящая мажорная гамма
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
    notes.forEach((freq, i) => {
      const t = now + i * 0.09;
      tone(ctx, freq, t, 0.28, 'triangle', 0.28);
      tone(ctx, freq * 2, t, 0.18, 'sine', 0.12);
    });

    // финальный радостный аккорд
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      tone(ctx, freq, now + 0.62, 0.7, 'sine', 0.22);
      tone(ctx, freq, now + 0.62 + i * 0.005, 0.7, 'triangle', 0.1);
    });
  }

  function tone(ctx, freq, start, dur, type, vol) {
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(vol, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.05);
  }

  function confetti() {
    const emojis = ['🎉', '💚', '⭐', '🎈', '✨', '🥳'];
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
      s.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 3500);
    }
  }

  btn.addEventListener('click', () => {
    changed = !changed;
    text.textContent = changed ? 'Юля Юля Юля' : 'Юля лучше всех';
    text.classList.remove('pop');
    void text.offsetWidth;      // перезапуск анимации
    text.classList.add('pop');
    playHappySound();
    confetti();
  });
</script>

</body>
</html>
